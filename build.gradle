buildscript {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url ='https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}